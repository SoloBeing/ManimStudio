name: Build ManimStudio

on:
  push:
    branches: [master, main, ui/editor-redesign]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            ffmpeg \
            libgl1-mesa-dev \
            libglib2.0-0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libnss3 \
            libxrandr2 \
            libgbm1

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pango pkg-config ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
        shell: pwsh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync

      - name: Install glfw
        run: uv run pip install glfw

      - name: Build React UI
        working-directory: Manim_Project_files/ui
        run: |
          npm ci
          npm run build

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        working-directory: Manim_Project_files
        run: |
          uv run python -m PyInstaller \
            --clean \
            --noconfirm \
            --distpath "${{ github.workspace }}/dist" \
            --workpath "build" \
            ManimStudio.spec

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: Manim_Project_files
        shell: pwsh
        run: |
          uv run python -m PyInstaller `
            --clean `
            --noconfirm `
            --distpath "${{ github.workspace }}/dist" `
            --workpath "build" `
            ManimStudio.spec

      - name: Zip artifact (Linux / macOS)
        if: runner.os != 'Windows'
        run: cd "${{ github.workspace }}/dist" && zip -r "${{ github.workspace }}/ManimStudio-${{ matrix.name }}.zip" "ManimStudio/"

      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ github.workspace }}/dist/ManimStudio" -DestinationPath "${{ github.workspace }}/ManimStudio-${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManimStudio-${{ matrix.name }}
          path: ManimStudio-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "ManimStudio ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/ManimStudio-linux/ManimStudio-linux.zip \
            artifacts/ManimStudio-macos/ManimStudio-macos.zip \
            artifacts/ManimStudio-windows/ManimStudio-windows.zip
