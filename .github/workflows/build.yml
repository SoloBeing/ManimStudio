name: Build ManimStudio

on:
  push:
    branches: [master, main, ui/editor-redesign]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            ffmpeg \
            libgl1-mesa-dev \
            libglib2.0-0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libnss3 \
            libxrandr2 \
            libgbm1

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pango pkg-config ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
        shell: pwsh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install Python dependencies
        run: uv sync

      - name: Install glfw
        run: uv run pip install glfw

      - name: Build React UI
        working-directory: Manim_Project_files/ui
        run: |
          npm ci
          npm run build

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        working-directory: Manim_Project_files
        run: |
          uv run python -m PyInstaller \
            --clean \
            --noconfirm \
            --distpath "${{ github.workspace }}/dist" \
            --workpath "build" \
            ManimStudio.spec

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: Manim_Project_files
        shell: pwsh
        run: |
          uv run python -m PyInstaller `
            --clean `
            --noconfirm `
            --distpath "${{ github.workspace }}/dist" `
            --workpath "build" `
            ManimStudio.spec

      - name: Zip artifact (Linux / macOS)
        if: runner.os != 'Windows'
        run: cd "${{ github.workspace }}/dist" && zip -r "${{ github.workspace }}/ManimStudio-${{ matrix.name }}.zip" "ManimStudio/"

      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ github.workspace }}/dist/ManimStudio" -DestinationPath "${{ github.workspace }}/ManimStudio-${{ matrix.name }}.zip"

      - name: Build .deb package (Linux)
        if: runner.os == 'Linux'
        working-directory: Manim_Project_files
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            DEB_VERSION="${GITHUB_REF_NAME#v}"
          else
            DEB_VERSION="0.0.0+${GITHUB_SHA::7}"
          fi
          bash packaging/deb/build_deb.sh "$DEB_VERSION" \
            --skip-build --dist "${{ github.workspace }}/dist"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "ManimStudio ${{ github.ref_name }}" \
            --generate-notes || true
          gh release upload "${{ github.ref_name }}" \
            "ManimStudio-${{ matrix.name }}.zip" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Upload .deb to GitHub Release
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEB="$(ls "${{ github.workspace }}/dist"/manimstudio_*_amd64.deb | head -1)"
          gh release upload "${{ github.ref_name }}" "$DEB" \
            --repo "${{ github.repository }}" --clobber
